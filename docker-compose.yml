services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gamebattle
      POSTGRES_PASSWORD: gamebattle
      POSTGRES_DB: gamebattle
    ports:
      - "5432:5432"
    volumes:
      - gamebattle_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamebattle -d gamebattle"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    env_file:
      - ./back/.env
    environment:
      # Surcharge l'URL pour pointer vers le service `db` à l'intérieur du réseau Docker
      GAMEBATTLE_DATABASE_URL: postgresql+asyncpg://gamebattle:gamebattle@db:5432/gamebattle
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./back:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  gamebattle_db_data:
